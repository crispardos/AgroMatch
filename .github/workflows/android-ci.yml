name: Compilar Android

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Compilar app Android
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Configurar Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Aceptar licencias e instalar SDK 37
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install "platforms;android-37.0" "build-tools;36.0.0"

      - name: Configurar caché de Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar aplicación
        run: ./gradlew --no-daemon assembleDebug
