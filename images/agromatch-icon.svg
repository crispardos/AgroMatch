      <path d="M258 416Q261 370 258 316" fill="none" stroke-width="7"/>
      <ellipse cx="245" cy="329" rx="7" ry="15" transform="rotate(-38 245 329)"/>
      <ellipse cx="271" cy="340" rx="7" ry="15" transform="rotate(38 271 340)"/>
      <ellipse cx="244" cy="352" rx="7" ry="15" transform="rotate(-38 244 352)"/>
      <ellipse cx="272" cy="364" rx="7" ry="15" transform="rotate(38 272 364)"/>
      <ellipse cx="248" cy="376" rx="7" ry="14" transform="rotate(-34 248 376)"/>
      <path d="m258 318-10-18m11 18 10-18" fill="none" stroke-width="5"/>
